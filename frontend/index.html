<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Digital Clan Books — a curated digital library with premium reading, free previews, and offline support."
    />
    <meta name="theme-color" content="#020617" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>Digital Clan Books</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #020617;
      }
      #splash .splash-mark {
        animation: splashMarkIn 0.9s ease-out both;
      }
      #splash .splash-bar-track {
        margin-top: 1.75rem;
        width: 7rem;
        height: 2px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
      }
      #splash .splash-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #e8dcc8, #d4a574);
        border-radius: 999px;
        animation: splashProgress 1.1s ease-in-out 0.15s both;
      }
      @keyframes splashMarkIn {
        from { opacity: 0; transform: scale(0.94); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes splashProgress {
        from { width: 0%; }
        to { width: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-mark, #splash .splash-bar-fill { animation: none !important; }
        #splash .splash-bar-fill { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="splash-mark" width="64" height="64" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="11" fill="url(#splash-bg)"/>
        <path d="M24 8C18 8 13 11 11 14v22c2.5-2.5 6.5-4 13-4s10.5 1.5 13 4V14c-2-3-7-6-13-6z" fill="url(#splash-cover)" opacity="0.95"/>
        <path d="M24 32c-6.5 0-10.5 1.5-13 4V14c2-3 7-6 13-6v24z" fill="#0f172a" opacity="0.35"/>
        <path d="M24 8v24" stroke="url(#splash-gold)" stroke-width="1.2" stroke-linecap="round"/>
        <defs>
          <linearGradient id="splash-bg" x1="8" y1="6" x2="42" y2="44" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
          </linearGradient>
          <linearGradient id="splash-cover" x1="11" y1="8" x2="37" y2="40" gradientUnits="userSpaceOnUse">
            <stop stop-color="#334155"/><stop offset="1" stop-color="#1e293b"/>
          </linearGradient>
          <linearGradient id="splash-gold" x1="24" y1="8" x2="24" y2="32" gradientUnits="userSpaceOnUse">
            <stop stop-color="#e8dcc8"/><stop offset="1" stop-color="#d4a574"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="splash-bar-track"><div class="splash-bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
