# Digital Clan Books — Docker Compose stack
services:
  db:
    image: postgres:16-alpine
    container_name: dcb_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dcb_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dcb_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID}
      EBOOK_STORAGE_PATH: ${EBOOK_STORAGE_PATH}
      PUBLIC_COVERS_PATH: ${PUBLIC_COVERS_PATH}
      SECURE_EBOOKS_PATH: ${SECURE_EBOOKS_PATH}
      PUBLIC_COVERS_URL_PREFIX: ${PUBLIC_COVERS_URL_PREFIX}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
    volumes:
      - public_storage:/app/storage/public
      - secure_ebooks:/app/storage/secure/ebooks
      - ./data:/app/seed_data:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dcb_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_PAYPAL_CLIENT_ID: ${VITE_PAYPAL_CLIENT_ID}
    container_name: dcb_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - dcb_net

  nginx:
    image: nginx:alpine
    container_name: dcb_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - public_storage:/app/storage/public:ro
    depends_on:
      - frontend
      - backend
    networks:
      - dcb_net
 

networks:
  dcb_net:
    driver: bridge

volumes:
  postgres_data:
  public_storage:
  secure_ebooks:
